version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Tokyo'
    open-pull-requests-limit: 10
    groups:
      npm-dependencies:
        patterns:
          - '*'
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore(deps)'
